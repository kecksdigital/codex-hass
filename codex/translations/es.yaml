configuration:
  enable_mcp:
    name: Habilitar MCP de Home Assistant
    description: >-
      Habilita el servidor MCP de Home Assistant para interacción directa con
      entidades y servicios desde Codex. Permite que Codex consulte estados,
      llame servicios e interactúe con tu hogar inteligente.
  terminal_font_size:
    name: Tamaño de Fuente del Terminal
    description: >-
      Tamaño de fuente del terminal web en píxeles (10-24).
      Ajusta para mejor legibilidad en tu pantalla.
  terminal_theme:
    name: Tema del Terminal
    description: >-
      Tema de colores del terminal web.
      Elige 'dark' para fondo oscuro o 'light' para fondo claro.
  working_directory:
    name: Directorio de Trabajo
    description: >-
      El directorio predeterminado cuando Codex inicia.
      Usa /homeassistant para acceso directo a los archivos de configuración de HA.
  session_persistence:
    name: Persistencia de Sesión
    description: >-
      Habilita persistencia de sesión vía tmux. Cuando está habilitado, tu
      sesión del terminal sobrevive a actualizaciones del navegador y desconexiones.
      Déjalo deshabilitado para el primer inicio de sesión y habilítalo para
      trabajos de larga duración.
  default_model:
    name: Modelo Predeterminado
    description: >-
      Modelo persistente de inicio para Codex. La App inicia con gpt-5.4,
      y los usuarios todavía pueden cambiar el modelo durante la sesión con
      /model.
  codex_permissions:
    name: Nivel de Acceso de Codex
    description: >-
      Perfil de sandbox local predeterminado para Codex. Workspace permite
      trabajo normal en el proyecto de Home Assistant. Full access usa
      sandbox danger-full-access y elimina restricciones locales de sandbox.
  codex_approval_policy:
    name: Política de Aprobación de Codex
    description: >-
      Controla cuándo Codex pide aprobación antes de ejecutar acciones. Usa
      on-request para seguridad interactiva, untrusted para pedir aprobación en
      comandos no confiables, o never para ejecución autónoma sin avisos.
  auto_update_codex:
    name: Actualizar Codex CLI automáticamente
    description: >-
      Busca la versión más reciente de Codex CLI al iniciar con una instalación
      npm limitada por tiempo. Deshabilitado por defecto para mantener un inicio
      predecible.
  codex_update_timeout:
    name: Tiempo máximo de actualización
    description: >-
      Segundos máximos para esperar la actualización opcional de Codex CLI al
      iniciar. Solo aplica cuando la actualización automática está habilitada.
  ssh_enabled:
    name: Habilitar SSH
    description: >-
      Inicia OpenSSH para el usuario codex sin privilegios. También debes
      mapear el puerto 22 del contenedor en la sección Red.
  ssh_password:
    name: Contraseña SSH
    description: >-
      Contraseña del usuario SSH codex. Déjala vacía para deshabilitar el
      acceso por contraseña. El acceso con clave pública puede usarse a la vez.
  authorized_keys:
    name: Claves SSH autorizadas
    description: >-
      Claves públicas autorizadas para iniciar sesión como codex. Añade una
      clave pública completa por elemento de la lista.
  mcp_servers:
    name: Servidores MCP remotos
    description: >-
      Servidores MCP HTTP Streamable que se añadirán a Codex. Para cada token
      bearer no vacío, la App crea automáticamente una variable de entorno
      protegida y configura bearer_token_env_var para ese servidor.
    fields:
      name:
        name: Nombre del servidor
        description: Nombre único del servidor MCP de Codex. homeassistant está reservado.
      url:
        name: URL del servidor
        description: Endpoint MCP HTTP Streamable que comienza con http:// o https://.
      bearer_token:
        name: Token bearer
        description: Token opcional que la App pasa automáticamente mediante una variable de entorno.
  environment_variables:
    name: Variables de entorno
    description: >-
      Variables de entorno adicionales para Codex y sus servidores MCP. Los
      valores se tratan como secretos y están disponibles en sesiones de
      terminal y SSH de Codex.
    fields:
      name:
        name: Nombre de la variable
        description: Nombre de variable de entorno con letras, números y guiones bajos.
      value:
        name: Valor de la variable
        description: Valor disponible para Codex y sus servidores MCP.

network:
  7681/tcp: Terminal Web (ttyd)
  22/tcp: Servidor SSH (deshabilitado por defecto)
